name: DiskTidy scanner

on:
  push:
    branches: [disktidy-scanner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p edirstat --lib --no-default-features -- -D warnings
      - run: cargo clippy --locked -p edirstat --bin edirstat-scan --no-default-features -- -D warnings
      - run: cargo test --locked -p edirstat --lib --no-default-features

  windows-scanner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check original GUI binary
        run: cargo check --locked --target x86_64-pc-windows-msvc -p edirstat --bin edirstat
      - name: Build headless scanner
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p edirstat --bin edirstat-scan --no-default-features
      - name: Smoke test SQLite export
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "edirstat-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $smokeRoot 'file.txt') -Value 'scanner smoke test'
          $snapshot = Join-Path $smokeRoot 'scan.sqlite3'
          & target/x86_64-pc-windows-msvc/release/edirstat-scan.exe $smokeRoot --output $snapshot --engine walk
          if ($LASTEXITCODE -ne 0) { throw 'Scanner failed' }
          if (!(Test-Path -LiteralPath $snapshot)) { throw 'SQLite snapshot missing' }
      - name: Upload scanner and resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: edirstat-scan-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/edirstat-scan.exe
            Cargo.lock
          if-no-files-found: error
